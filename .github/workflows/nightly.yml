# Nightly and on main (E2E + chaos; expected green three nights in a row).
#   e2e:            pytest -m e2e (the end-to-end edit flows in-process, sim upstream) and pytest -m docker
#                   (sandbox egress against a real Docker sandbox)
#   control-image:  `docker compose -f deploy/docker-compose.yml up control`
#                   in sim mode with no keys: boot, `ratchet simulate 1..3 --headless` inside
#                   the container, then Playwright against it
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.18"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  RATCHET_UPSTREAM: sim
  RATCHET_TAVILY_MODE: fixtures

jobs:
  e2e:
    name: pytest e2e + docker
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: pytest -m e2e
        run: uv run pytest -m e2e -q --junitxml=e2e.xml
      - uses: docker/setup-buildx-action@v4
      - name: build ratchet-worker:dev for the docker-marked tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          tags: ratchet-worker:dev
          load: true
          cache-from: type=gha,scope=worker
      - name: sandbox network
        run: deploy/sandbox-network.sh
      - name: pytest -m docker (sandbox egress, docker sandbox)
        run: uv run pytest -m docker -q --junitxml=docker.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-pytest
          path: "*.xml"
          retention-days: 14

  control-image:
    name: control image e2e (simulate + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/control.Dockerfile
          target: control
          tags: ratchet-control:dev
          load: true
          cache-from: type=gha,scope=control
      - name: docker compose up control (sim, no keys)
        run: |
          docker compose -f deploy/docker-compose.yml up -d --no-build control
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
      - name: simulate 1..3 --headless (exit 0 = expected decision)
        run: |
          for k in 1 2 3; do
            start=$SECONDS
            timeout 120 docker compose -f deploy/docker-compose.yml exec -T control \
              ratchet simulate "$k" --headless
            echo "scenario $k: $((SECONDS - start)) s"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Playwright against the container
        working-directory: dashboard
        env:
          RATCHET_E2E_URL: http://127.0.0.1:8080
          RATCHET_CONTROL_IMAGE: ratchet-control:dev
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cp ../deploy/e2e/playwright.control.config.ts playwright.control.config.ts
          mkdir -p e2e-control && cp ../deploy/e2e/*.spec.ts e2e-control/
          npx playwright test -c playwright.control.config.ts
      - name: container logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail 300 control || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-control
          path: |
            dashboard/playwright-report-control
            dashboard/test-results
          retention-days: 14

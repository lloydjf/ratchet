# Backup uptime probe for the public demo (an alerting backstop). The primary
# monitor is external with 1-minute checks (deploy/vm/uptime.md); this one runs every 5 min
# from GitHub, fails the run when /healthz is down twice, and GitHub emails the failure.
# Set the repository variable RATCHET_PUBLIC_URL (Settings -> Variables) to enable it.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    if: vars.RATCHET_PUBLIC_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: GET /healthz (2 tries, 30 s apart)
        env:
          URL: ${{ vars.RATCHET_PUBLIC_URL }}
        run: |
          for attempt in 1 2; do
            if curl -fsS --max-time 10 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "${URL%/}/healthz"; then
              exit 0
            fi
            echo "attempt $attempt failed"
            [ "$attempt" -eq 1 ] && sleep 30
          done
          echo "::error::${URL%/}/healthz is down"
          exit 1

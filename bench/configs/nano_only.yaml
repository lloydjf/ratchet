# E4: single-tier judging. The only judge's `regressed` may BLOCK (decide.py
# single_judge_blocks). Re-judges the cascade run's replays (run cascade.yaml first).
name: nano_only
description: Nano only — every pair judged by nano alone (Level 0 and drift as in the cascade).
experiments: [E4]
mode: edits
cascade: {mode: nano_only, level0: true, drift: true}
single_judge_blocks: true
reuse_replays: cascade
concurrency: 2

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Cost per verdict vs detection recall</title>
<desc id="fig-desc">SIMULATED MODELS — pipeline smoke test; not benchmark results nano_only: $0.0004 per verdict, recall 1.00; super_only: $0.0034 per verdict, recall 1.00; ultra_only: $0.0116 per verdict, recall 1.00; cascade: $0.0052 per verdict, recall 1.00</desc>
<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; font: 13px system-ui, -apple-system, sans-serif; }
  .muted { fill: #52514e; font: 12px system-ui, -apple-system, sans-serif; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #8a8984; stroke-width: 1; }
  .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; }
    .muted { fill: #c3c2b7; }
    .grid { stroke: #33322f; }
    .axis { stroke: #77766f; }
    .dot { fill: #3987e5; stroke: #1a1a19; }
  }
</style>

[project]
name = "ratchet-ci"
version = "0.1.0"
description = "Regression CI for self-improving agents: replay blessed tasks against every skill edit, judge with a Nemotron cascade, block what breaks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ratchet contributors" }]
keywords = ["agents", "llm", "regression-testing", "ci", "evaluation", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Lower bounds are the versions the lock was tested with; upper bounds stop at the next
# major (or at 1.0 for 0.x projects, whose minors may break).
dependencies = [
    "fastapi>=0.143.2,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "gitpython>=3.2.1,<4",
    "watchdog>=6.0.0,<7",
    "typer>=0.27.3,<1",
    "deepdiff>=9.1.0,<10",
    "tavily-python>=0.8.5,<1",
    "pyyaml>=6.0.3,<7",
    "zstandard>=0.25.0,<1",
    "cryptography>=50.0.2,<51",
    "sse-starlette>=3.5.0,<4",
    "prometheus-client>=0.26.0,<1",
    "mcp>=2.0.0,<3",
]

[project.urls]
Homepage = "https://ratchetci.dev"
Documentation = "https://ratchetci.dev/docs"
Repository = "https://github.com/lloydjf/ratchet"
Issues = "https://github.com/lloydjf/ratchet/issues"
Changelog = "https://github.com/lloydjf/ratchet/blob/main/CHANGELOG.md"

[project.scripts]
ratchet = "ratchet.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Release builds ship the built dashboard: scripts/build_wheel.py maps dashboard/dist into
# the wheel as ratchet/_dashboard_dist (Settings finds it there). Build the SPA first:
#   (cd dashboard && npm ci && npm run build) && uv build
[tool.hatch.build.hooks.custom]
path = "scripts/build_wheel.py"

[tool.hatch.build.targets.wheel]
packages = ["ratchet"]

# The sdist is a whitelist (so local state, results and editor files never ship), plus the
# built SPA, which is gitignored and therefore listed as an artifact.
[tool.hatch.build.targets.sdist]
only-include = [
    "ratchet",
    "scripts/build_wheel.py",
    "dashboard/dist",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
artifacts = ["dashboard/dist/**"]
exclude = [
    "var/",
    "data/",
    "bench/results/",
    "scenarios/golden/",
    "dashboard/node_modules/",
    "internal/",
    "site/",
    "**/__pycache__",
    ".env",
    ".env.*",
    "*.key",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", "data", "internal"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "TID"]
# N818: the budget exception is named `BudgetExceeded` on purpose.
ignore = ["N818"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use ratchet.clock.now(); it is patchable and frozen inside replays."
"datetime.datetime.utcnow".msg = "Use ratchet.clock.now()."

[tool.ruff.lint.per-file-ignores]
"ratchet/clock.py" = ["TID251"]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ratchet"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tavily.*", "deepdiff.*", "zstandard.*", "watchdog.*", "git.*", "sse_starlette.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real Token Factory / Tavily; manual workflow only, capped at $2",
    "e2e: end-to-end through the full local stack",
    "docker: needs a running Docker daemon",
    "hermes: runs the Hermes Agent checkout at var/hermes/src (offline, sim upstream)",
]
addopts = "-m 'not live and not docker and not e2e and not hermes' --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["ratchet"]
branch = true
